name: Email Notification CI

on:
  push:
    branches:
      - feature/*
      - master
      - main
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.example.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: GitHub Action Notification - ${{ github.event_name }}
          body: |
            A new ${{ github.event_name }} event has occurred in the repository ${{ github.repository }}.
            Commit SHA: ${{ github.sha }}
            Branch: ${{ github.ref }}
          to: ${{ secrets.EMAIL_TO }}
          from: 'GitHub Actions <${{ secrets.EMAIL_USERNAME }}>'